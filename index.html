<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101a2d" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>Lumina – Smart Storage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Lumina, início"><span class="brand-mark">L</span><span><strong>Lumina</strong><small>SMART STORAGE</small></span></a>
      <div class="nav-label">GESTÃO</div>
      <nav class="nav-list" aria-label="Navegação principal">
        <button class="nav-item active" data-view="dashboard"><span>▦</span>Dashboard</button>
        <button class="nav-item" data-view="inventory"><span>▤</span>Inventário</button>
        <button class="nav-item" data-view="products"><span>◇</span>Produtos</button>
        <button class="nav-item" data-view="movements"><span>⇄</span>Movimentações</button>
        <button class="nav-item" data-view="count"><span>☷</span>Conferência</button>
        <button class="nav-item" data-view="audit"><span>⌕</span>Auditoria por EAN</button>
      </nav>
      <div class="nav-label">OPERAÇÃO</div>
      <nav class="nav-list" aria-label="Operações">
        <button class="nav-item" data-view="clients"><span>♧</span>Clientes</button>
        <button class="nav-item" data-view="operators"><span>♙</span>Operadores</button>
        <button class="nav-item" data-view="requests"><span>☑</span>Solicitações</button>
        <button class="nav-item" data-view="stats"><span>▥</span>Estatísticas</button>
        <button class="nav-item" data-view="backup"><span>⇩</span>Backup e dados</button>
      </nav>
      <div class="sidebar-bottom"><span class="online-dot"></span> Armazenamento local ativo<small>Dados somente neste navegador</small></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button id="menuToggle" class="icon-btn mobile-menu" aria-label="Abrir menu">☰</button><div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="pageTitle">Dashboard</strong></div><div class="top-actions"><button class="scan-shortcut" data-action="open-scan">▦ <span>Ler código</span></button><span class="local-pill"><i></i> Local</span></div></header>
      <section id="app" class="page-content" aria-live="polite"></section>
      <footer class="privacy-note">Seus dados ficam armazenados somente neste navegador. Limpar os dados do navegador pode apagá-los; não há sincronização entre dispositivos.</footer>
    </main>
  </div>
  <div id="modalRoot"></div>
  <input id="restoreFile" type="file" accept="application/json,.json" hidden />
  <script src="barcode-decoder.js"></script>
  <script src="script.js"></script>
</body>
</html>
